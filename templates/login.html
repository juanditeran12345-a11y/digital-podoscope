<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar, Podoscopio digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--papel:#f3f6f8;--tinta:#17262d;--apagado:#5b6f79;--regla:#d4dde2;--azul:#1b5e87;--azul-oscuro:#144a6b;--error:#a32727}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--papel);color:var(--tinta);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px;line-height:1.45}
h1,h2,p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.tarjeta{width:min(420px,100%);background:#fff;border:1px solid var(--regla);border-radius:6px;padding:28px 28px 26px}
.marca{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.marca h1{font-size:18px;font-weight:600}
.marca p{font-size:13px;color:var(--apagado)}
.pestanas{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--regla);margin-bottom:20px}
.pestanas button{background:none;border:0;border-bottom:3px solid transparent;padding:10px;margin-bottom:-1px;cursor:pointer;color:var(--apagado);font-weight:500}
.pestanas button[aria-selected="true"]{color:var(--azul-oscuro);border-bottom-color:var(--azul)}
.campo{display:block;margin-bottom:14px}
.campo span{display:block;font-size:13px;color:var(--apagado);margin-bottom:4px}
.campo input{width:100%;padding:10px 12px;border:1px solid var(--regla);border-radius:4px;background:#fff}
.campo input:focus{border-color:var(--azul)}
.ayuda{font-size:13px;color:var(--apagado);margin:-4px 0 14px}
.error{min-height:1.4em;color:var(--error);font-size:14px;margin-bottom:10px}
.entrar{width:100%;padding:11px;border:1px solid var(--azul);background:var(--azul);color:#fff;border-radius:6px;font-weight:500;cursor:pointer}
.entrar:hover:not(:disabled){background:var(--azul-oscuro)}
.entrar:disabled{opacity:.55;cursor:wait}
</style>
</head>
<body>
<main class="tarjeta">
  <div class="marca">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <rect width="34" height="34" rx="8" fill="#1b5e87"/>
      <path d="M13 12.5c2.2-1.6 5.6-.6 6.6 2.4.9 2.7.2 5.4-.4 8-.5 2.2-2.4 3.7-4.5 3.2-2.3-.5-3-3.2-2.8-5.5.2-2.2-.2-5.4 1.1-8.1z" fill="#fff"/>
      <circle cx="12.4" cy="8.4" r="1.5" fill="#fff"/><circle cx="16.3" cy="7.2" r="1.4" fill="#fff"/>
      <circle cx="19.9" cy="8" r="1.3" fill="#fff"/><circle cx="22.6" cy="10" r="1.2" fill="#fff"/>
    </svg>
    <div><h1>Podoscopio digital</h1><p>Ingresa a tu cuenta</p></div>
  </div>

  <div class="pestanas" role="tablist" aria-label="Tipo de cuenta">
    <button type="button" role="tab" id="tab-paciente" data-tipo="paciente" aria-selected="true">Soy paciente</button>
    <button type="button" role="tab" id="tab-profesional" data-tipo="profesional" aria-selected="false">Soy profesional</button>
  </div>

  <form id="formulario" novalidate>
    <label class="campo"><span id="etiquetaId">Número de documento</span>
      <input id="identificador" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label class="campo"><span id="etiquetaClave">Clave de acceso</span>
      <input id="clave" type="password" autocomplete="current-password" required></label>
    <p class="ayuda" id="ayuda">La clave de acceso de 6 dígitos te la entrega tu profesional cuando te registra.</p>
    <p class="error" id="error" role="alert"></p>
    <button class="entrar" id="entrar" type="submit">Ingresar</button>
  </form>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
let tipo = "paciente";

const TEXTOS = {
  paciente:    { id: "Número de documento", clave: "Clave de acceso", ayuda: "La clave de acceso de 6 dígitos te la entrega tu profesional cuando te registra.", inputmode: "text", usuario: "username" },
  profesional: { id: "Usuario", clave: "Contraseña", ayuda: "Si aún no tienes cuenta, pídesela al administrador de la plataforma.", inputmode: "text", usuario: "username" }
};

function elegir(nuevo){
  tipo = nuevo;
  document.querySelectorAll(".pestanas button").forEach(b => b.setAttribute("aria-selected", b.dataset.tipo === nuevo));
  const t = TEXTOS[nuevo];
  $("etiquetaId").textContent = t.id; $("etiquetaClave").textContent = t.clave; $("ayuda").textContent = t.ayuda;
  $("identificador").value = ""; $("clave").value = ""; $("error").textContent = "";
  $("identificador").focus();
}
document.querySelectorAll(".pestanas button").forEach(b => b.addEventListener("click", () => elegir(b.dataset.tipo)));

$("formulario").addEventListener("submit", async e => {
  e.preventDefault();
  $("error").textContent = "";
  const identificador = $("identificador").value.trim(), clave = $("clave").value;
  if (!identificador || !clave){ $("error").textContent = "Completa los dos campos."; return; }
  $("entrar").disabled = true;
  try{
    const r = await fetch("/api/login", {
      method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tipo, identificador, clave })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok){ $("error").textContent = j.error || "No se pudo iniciar sesión."; $("clave").value = ""; return; }
    location.href = j.destino || "/";
  } catch (err){
    $("error").textContent = "No se pudo conectar con el servidor.";
  } finally {
    $("entrar").disabled = false;
  }
});
</script>
</body>
</html>
